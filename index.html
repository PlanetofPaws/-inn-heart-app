<style>
  :root{
    --bg:#3B3B3D; --card:#4A4A4C; --ink:#FFFFFF; --ink-soft:#C7C7C9;
    --pine:#4CAF7D; --pine-soft:rgba(76,175,125,0.22); --ochre:#B39DDB; --ochre-soft:rgba(179,157,219,0.22);
    --line:#5C5C5E; --danger:#E57373; --danger-soft:rgba(229,115,115,0.2); --deep:#1E1E1F;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:'Noto Sans TC','PingFang TC','Heiti TC','Microsoft JhengHei',sans-serif;font-weight:500;color:var(--ink);display:flex;justify-content:center;-webkit-font-smoothing:antialiased;}
  .phone{width:100%;max-width:420px;min-height:100vh;padding:0 0 40px;}
  .screen{display:none;}
  .screen.active{display:block;}

  .login-wrap{padding:70px 30px 0;text-align:center;}
  .login-wrap .mark{font-weight:900;font-size:24px;margin-bottom:6px;}
  .login-wrap p.hint{font-size:13px;color:var(--ink-soft);line-height:1.6;margin:0 0 26px;}
  .login-field{margin-bottom:12px;text-align:left;}
  .login-field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;}
  .login-field input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-size:15px;font-family:'Noto Sans TC',sans-serif;color:var(--ink);}
  .login-btn{width:100%;background:var(--pine);color:#F4F1E9;border:none;border-radius:14px;padding:14px;font-weight:600;font-size:15px;margin-top:8px;cursor:pointer;}
  .login-note{font-size:12px;color:var(--ink-soft);margin-top:16px;line-height:1.6;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 4px;font-size:13px;color:var(--ink-soft);}
  .pet-tabs{display:flex;gap:8px;padding:14px 22px 0;}
  .pet-tab{flex:1;text-align:center;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:14px;color:var(--ink-soft);cursor:pointer;}
  .pet-tab.active{background:var(--pine);border-color:var(--pine);color:#F4F1E9;}

  .hero{padding:16px 22px 0;display:flex;gap:16px;align-items:center;}
  .avatar{width:76px;height:76px;border-radius:20px;flex-shrink:0;background:radial-gradient(circle at 30% 30%,#E8DCC8,transparent 60%),linear-gradient(155deg,#D8CBAE,#B9A47D);}
  .hero-text .loc{font-size:12px;color:var(--ink-soft);margin:0 0 2px;}
  .hero-text h1{font-weight:900;font-size:26px;margin:0;}

  .summary-strip{display:flex;gap:10px;padding:16px 22px;}
  .summary-item{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;}
  .summary-item .num{font-weight:900;font-size:20px;color:var(--pine);}
  .summary-item .lbl{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

  .notes-card{margin:0 22px 20px;padding:13px 16px;border-radius:14px;font-size:13px;line-height:1.5;}
  .notes-card.warn{background:var(--danger-soft);color:var(--danger);}
  .notes-card.plain{background:var(--pine-soft);color:var(--pine);}
  .cam-card{margin:0 22px 20px;background:var(--pine);border-radius:18px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;color:#F4F1E9;}
  .cam-card .title{font-weight:900;font-size:16px;margin:0;}
  .cam-card .sub{font-size:12px;opacity:.8;margin:4px 0 0;}
  .cam-btn{background:#F4F1E9;color:var(--pine);border:none;padding:9px 16px;border-radius:12px;font-weight:600;font-size:13.5px;cursor:pointer;text-decoration:none;display:inline-block;}
  .snack-card{margin:0 22px 20px;padding:11px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .snack-card span{font-size:12.5px;color:var(--ink-soft);}
  .snack-card a{font-size:12px;color:var(--ochre);font-weight:600;text-decoration:none;white-space:nowrap;}

  .timeline{padding:0 22px;position:relative;}
  .timeline::before{content:"";position:absolute;left:44px;top:6px;bottom:20px;width:1px;background:var(--line);}
  .entry{display:flex;gap:16px;padding-bottom:22px;position:relative;}
  .entry .time{width:44px;flex-shrink:0;font-size:12px;color:var(--ink-soft);padding-top:3px;text-align:right;position:relative;}
  .entry .time::after{content:"";position:absolute;right:-4.5px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--card);border:2px solid var(--pine);}
  .entry.warn .time::after{border-color:var(--danger);}
  .entry .body{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 16px;flex:1;}
  .entry.warn .body{border-color:var(--danger);}
  .entry .body .cat{font-size:11.5px;color:var(--ink-soft);margin:0 0 4px;}
  .entry .body p{margin:0;font-size:13.5px;color:var(--ink-soft);line-height:1.55;}

  .status-msg{padding:20px 22px;font-size:13px;color:var(--ink-soft);text-align:center;}
  .footer-note{padding:0 22px;font-size:11.5px;color:var(--ink-soft);text-align:center;line-height:1.6;}
  .history-date-row{background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .history-date-row .date{font-weight:700;font-size:15px;}
  .history-date-row .arrow{color:var(--ink-soft);}

  .day-tabs{display:flex;gap:8px;padding:0 22px 14px;overflow-x:auto;}
  .day-tab{flex-shrink:0;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--ink-soft);cursor:pointer;}
  .day-tab.active{background:var(--deep);border-color:var(--deep);color:#F4F1E9;}
</style>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
<div class="phone">

  <div class="screen active" id="screenLogin">
    <div class="login-wrap">
      <div class="mark">(inn)heart</div>
      <p class="hint">請輸入手機號碼查看寶貝的即時紀錄。</p>
      <div class="login-field">
        <label>手機號碼</label>
        <input type="text" id="phoneInput" placeholder="例如：0912345678">
      </div>
      <button class="login-btn" id="loginBtn">查看紀錄</button>
      <div class="login-note" id="loginNote"></div>
    </div>
  </div>

  <div class="screen" id="screenMenu">
    <div class="topbar"><span>(inn)heart</span><span id="phoneEcho2"></span></div>
    <div style="padding:20px 22px 0;display:flex;flex-direction:column;gap:12px;">
      <button class="login-btn" id="menuCurrentBtn" style="margin-top:0;">照護紀錄(現在住房中)</button>
      <button class="login-btn" id="menuHistoryBtn" style="margin-top:0;background:var(--ochre);">照護紀錄(歷史住房紀錄)</button>
      <div id="menuLogoutLink" style="text-align:center;font-size:12px;color:var(--ink-soft);text-decoration:underline;cursor:pointer;margin-top:6px;">不是我的寶貝?換一支電話號碼</div>
    </div>
  </div>

  <div class="screen" id="screenHistoryList">
    <div class="topbar"><span id="historyBackLink" style="text-decoration:underline;cursor:pointer;">← 返回選單</span><span id="phoneEcho3"></span></div>
    <div class="pet-tabs" id="historyPetTabs"></div>

    <div class="hero">
      <div class="avatar" id="historyAvatar"></div>
      <div class="hero-text">
        <p class="loc">歷史入住紀錄</p>
        <h1 id="historyPetName"></h1>
      </div>
    </div>

    <div id="historyDateList" style="padding:4px 22px 20px;"></div>
  </div>

  <div class="screen" id="screenMain">
    <div class="topbar"><span id="menuBackLink" style="text-decoration:underline;cursor:pointer;">← 返回選單</span><span id="phoneEcho"></span></div>
    <div class="pet-tabs" id="petTabs"></div>

    <div class="hero">
      <div class="avatar" id="mainAvatar"></div>
      <div class="hero-text">
        <p class="loc" id="mainLoc"></p>
        <h1 id="mainName"></h1>
      </div>
    </div>

    <div id="notesArea"></div>
    <div id="cameraArea"></div>
    <div id="snackArea"></div>

    <div class="summary-strip" id="summaryStrip"></div>
    <div id="moodRow" style="padding:0 22px 4px;font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;"></div>
    <div id="dayHighlight" style="padding:0 22px 12px;font-size:13px;color:var(--ink-soft);"></div>

    <div class="day-tabs" id="dayTabs"></div>
    <div class="timeline" id="timeline"></div>
    <p class="footer-note" style="margin-top:14px;">📷 照片僅在寶貝住宿期間保留,退房後會自動清除,文字紀錄則會永久保存。</p>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDF0t4WRcgRVGOApUdLn8Oj8VbHy6vMZp8",
    authDomain: "innheart-2c876.firebaseapp.com",
    projectId: "innheart-2c876",
    storageBucket: "innheart-2c876.firebasestorage.app",
    messagingSenderId: "1090283293954",
    appId: "1:1090283293954:web:e4456c1c9b98cba333461b"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let myStays = [];
  let globalMihomeUrl = null;

  (async function loadGlobalSettings(){
    try {
      const snap = await getDoc(doc(db, 'settings', 'global'));
      if (snap.exists()) globalMihomeUrl = snap.data().mihomeUrl || null;
    } catch (err) { /* no settings yet, camera card simply won't show */ }
  })();

  function openMihomeApp(){
    if (!globalMihomeUrl) return;
    // if it's already a plain https link (e.g. an app-store link), just open it directly
    if (globalMihomeUrl.startsWith('http')){
      window.open(globalMihomeUrl, '_blank');
      return;
    }
    // otherwise treat it as a custom app URL scheme: try to open the app, fall back to the store after a short delay
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const storeUrl = isIOS
      ? 'https://apps.apple.com/app/mi-home/id957323480'
      : 'https://play.google.com/store/apps/details?id=com.xiaomi.smarthome';
    const fallbackTimer = setTimeout(() => { window.location.href = storeUrl; }, 1200);
    window.addEventListener('blur', () => clearTimeout(fallbackTimer), { once: true });
    window.location.href = globalMihomeUrl;
  }
  let currentIdx = 0;
  let pendingLineUserId = null;
  let myLineUserId = null;

  async function fetchStaysForPhone(phone){
    const snap = await getDocs(collection(db, 'rooms'));
    myStays = [];
    snap.forEach(d => {
      const data = d.data();
      if (data.phone === phone) myStays.push({ id: d.id, ...data, isActive: true });
    });

    const memberSnap = await getDoc(doc(db, 'members', phone));
    let memberAvatarUrl = null;
    if (memberSnap.exists()){
      memberAvatarUrl = memberSnap.data().avatarUrl || null;
      const history = memberSnap.data().history || [];
      history.slice().reverse().forEach(h => {
        myStays.push({
          id: h.roomId, area: h.area, no: h.no, name: h.petName,
          stayId: h.stayId, notes: null, isActive: false, checkedOutAt: h.checkedOutAt,
          checkinDate: h.checkinDate, avatarUrl: h.avatarUrl || memberAvatarUrl
        });
      });
    }
    myStays.forEach(s => { if (s.isActive && !s.avatarUrl) s.avatarUrl = memberAvatarUrl; });
    return myStays.length > 0;
  }

  function finalizeEntry(phone){
    document.getElementById('phoneEcho').textContent = '家長 ' + phone;
    document.getElementById('phoneEcho2').textContent = '家長 ' + phone;
    document.getElementById('phoneEcho3').textContent = '家長 ' + phone;
    document.getElementById('screenLogin').classList.remove('active');
    document.getElementById('screenMenu').classList.add('active');
  }

  async function enterWithPhone(phone){
    const found = await fetchStaysForPhone(phone);
    if (!found) return false;

    // first time binding via LINE: remember this LINE account so next visit skips the phone screen
    if (pendingLineUserId){
      await setDoc(doc(db, 'lineBindings', pendingLineUserId), { phone });
      pendingLineUserId = null;
    }

    finalizeEntry(phone);
    return true;
  }

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const note = document.getElementById('loginNote');
    const phone = document.getElementById('phoneInput').value.trim();
    if (!phone){ note.textContent = '請輸入手機號碼'; return; }
    note.textContent = '查詢中...';
    // run the LINE identity check and the phone lookup at the same time instead of one after another
    const [, found] = await Promise.all([liffReadyPromise, fetchStaysForPhone(phone)]);
    if (!found){ note.textContent = '目前查不到這支手機號碼的任何入住紀錄,請確認號碼是否正確,或洽詢櫃檯。'; return; }
    if (pendingLineUserId){
      await setDoc(doc(db, 'lineBindings', pendingLineUserId), { phone });
      pendingLineUserId = null;
    }
    finalizeEntry(phone);
  });

  // ---------- LINE LIFF auto-login ----------
  let liffReadyPromise = (async function tryLineAutoLogin(){
    if (typeof liff === 'undefined') return; // not loaded (e.g. offline), fall back to manual login
    try {
      await liff.init({ liffId: '2011605439-ZiNr1cLk' });
      if (!liff.isLoggedIn()){
        liff.login();
        return; // page will redirect through LINE login and reload
      }
      const profile = await liff.getProfile();
      const lineUserId = profile.userId;
      myLineUserId = lineUserId;
      const bindingSnap = await getDoc(doc(db, 'lineBindings', lineUserId));
      if (bindingSnap.exists()){
        document.getElementById('loginNote').textContent = '';
        await enterWithPhone(bindingSnap.data().phone);
      } else {
        pendingLineUserId = lineUserId;
        document.getElementById('loginNote').textContent = '第一次使用,請輸入手機號碼完成綁定,之後就不用再輸入了。';
      }
    } catch (err) {
      // LIFF unavailable (e.g. testing outside LINE) — manual phone login still works below
    }
  })();

  let viewMode = 'current';
  let visibleStays = [];
  let historyPets = []; // [{ name, avatarUrl, stays: [...] }]
  let historyIdx = 0;

  function enterMenuView(mode){
    viewMode = mode;
    if (mode === 'current'){
      visibleStays = myStays.filter(s => s.isActive);
      if (visibleStays.length === 0){
        alert('目前沒有寶貝入住中');
        return;
      }
      document.getElementById('screenMenu').classList.remove('active');
      document.getElementById('screenMain').classList.add('active');
      currentIdx = 0;
      renderPetTabs();
      renderPet();
      return;
    }

    // history mode: group past stays by pet name, show a pet picker + date list first
    const pastStays = myStays.filter(s => !s.isActive);
    if (pastStays.length === 0){
      alert('目前沒有已退房的歷史紀錄');
      return;
    }
    const byName = {};
    pastStays.forEach(s => {
      if (!byName[s.name]) byName[s.name] = { name: s.name, avatarUrl: s.avatarUrl, stays: [] };
      byName[s.name].stays.push(s);
    });
    historyPets = Object.values(byName);
    historyPets.forEach(p => {
      p.stays.sort((a,b) => (b.checkedOutAt || '').localeCompare(a.checkedOutAt || ''));
      if (p.stays[0] && p.stays[0].avatarUrl) p.avatarUrl = p.stays[0].avatarUrl; // show the most recent photo for this pet
    });
    historyIdx = 0;
    document.getElementById('screenMenu').classList.remove('active');
    document.getElementById('screenHistoryList').classList.add('active');
    renderHistoryPetTabs();
    renderHistoryDateList();
  }

  function renderHistoryPetTabs(){
    const wrap = document.getElementById('historyPetTabs');
    if (historyPets.length <= 1){ wrap.innerHTML = ''; return; }
    wrap.innerHTML = historyPets.map((p, i) =>
      `<div class="pet-tab ${i === historyIdx ? 'active' : ''}" data-idx="${i}">${p.name}</div>`
    ).join('');
    wrap.querySelectorAll('.pet-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        historyIdx = parseInt(tab.dataset.idx);
        renderHistoryPetTabs();
        renderHistoryDateList();
      });
    });
  }

  function extractDateParts(str){
    if (!str) return null;
    const m = str.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    if (!m) return null;
    return { y: parseInt(m[1]), mo: parseInt(m[2]), d: parseInt(m[3]) };
  }

  function formatStayRange(s){
    const inParts = extractDateParts(s.checkinDate);
    const outParts = extractDateParts(s.checkedOutAt);
    if (!inParts && !outParts) return '(日期不詳)';
    const fmt = (p) => p ? (p.mo + '/' + p.d) : '?';
    if (!inParts || !outParts) return fmt(inParts || outParts);
    const inMs = Date.UTC(inParts.y, inParts.mo - 1, inParts.d);
    const outMs = Date.UTC(outParts.y, outParts.mo - 1, outParts.d);
    const days = Math.max(Math.round((outMs - inMs) / 86400000) + 1, 1);
    if (inMs === outMs) return fmt(inParts) + '(當日)';
    return fmt(inParts) + ' - ' + fmt(outParts) + '(入住' + days + '天)';
  }

  function renderHistoryDateList(){
    const pet = historyPets[historyIdx];
    document.getElementById('historyPetName').textContent = pet.name;
    const avatarEl = document.getElementById('historyAvatar');
    if (pet.avatarUrl){
      avatarEl.style.background = 'none';
      avatarEl.innerHTML = `<img src="${pet.avatarUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:20px;">`;
    } else {
      avatarEl.style.background = 'radial-gradient(circle at 30% 30%,#E8DCC8,transparent 60%),linear-gradient(155deg,#D8CBAE,#B9A47D)';
      avatarEl.innerHTML = '';
    }
    const listEl = document.getElementById('historyDateList');
    listEl.innerHTML = pet.stays.map((s, i) => {
      const dateLabel = formatStayRange(s);
      return `<div class="history-date-row" data-idx="${i}"><span class="date">${dateLabel}</span><span class="arrow">›</span></div>`;
    }).join('');
    listEl.querySelectorAll('.history-date-row').forEach(row => {
      row.addEventListener('click', () => {
        const stay = pet.stays[parseInt(row.dataset.idx)];
        visibleStays = [stay];
        currentIdx = 0;
        document.getElementById('screenHistoryList').classList.remove('active');
        document.getElementById('screenMain').classList.add('active');
        document.getElementById('petTabs').innerHTML = '';
        renderPet();
      });
    });
  }

  document.getElementById('menuCurrentBtn').addEventListener('click', () => enterMenuView('current'));
  document.getElementById('menuHistoryBtn').addEventListener('click', () => enterMenuView('history'));

  document.getElementById('historyBackLink').addEventListener('click', () => {
    document.getElementById('screenHistoryList').classList.remove('active');
    document.getElementById('screenMenu').classList.add('active');
  });

  document.getElementById('menuLogoutLink').addEventListener('click', async () => {
    if (!confirm('確定要解除目前這支 LINE 帳號的綁定嗎?下次打開會需要重新輸入電話號碼。')) return;
    if (myLineUserId){
      try { await deleteDoc(doc(db, 'lineBindings', myLineUserId)); } catch (err) { /* ignore if already gone */ }
      pendingLineUserId = myLineUserId; // re-arm binding so the next phone entered actually gets saved
    }
    document.getElementById('phoneInput').value = '';
    document.getElementById('loginNote').textContent = '請輸入正確的手機號碼重新綁定。';
    document.getElementById('screenMenu').classList.remove('active');
    document.getElementById('screenMain').classList.remove('active');
    document.getElementById('screenHistoryList').classList.remove('active');
    document.getElementById('screenLogin').classList.add('active');
  });
  document.getElementById('menuBackLink').addEventListener('click', () => {
    document.getElementById('screenMain').classList.remove('active');
    if (viewMode === 'history'){
      document.getElementById('screenHistoryList').classList.add('active');
    } else {
      document.getElementById('screenMenu').classList.add('active');
    }
  });

  function renderPetTabs(){
    const wrap = document.getElementById('petTabs');
    if (visibleStays.length <= 1){ wrap.innerHTML = ''; return; }
    wrap.innerHTML = visibleStays.map((r, i) => {
      const label = r.isActive ? r.name : r.name + '・已退房';
      return `<div class="pet-tab ${i === currentIdx ? 'active' : ''}" data-idx="${i}">${label}</div>`;
    }).join('');
    wrap.querySelectorAll('.pet-tab').forEach(tab => {
      tab.addEventListener('click', async () => {
        currentIdx = parseInt(tab.dataset.idx);
        renderPetTabs();
        await renderPet();
      });
    });
  }

  function dateStrOf(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function dateLabelOf(dateStr){
    const today = dateStrOf(new Date());
    const parts = dateStr.split('-');
    const md = parts[1] + '/' + parts[2];
    return dateStr === today ? '今天 ' + md : md;
  }

  let currentEntriesByDate = {};
  let currentSelectedDate = null;

  async function renderPet(){
    const room = visibleStays[currentIdx];
    document.getElementById('mainName').textContent = room.name;
    document.getElementById('mainLoc').textContent = (room.area === 'cat' ? '貓貓區' : '狗狗區') + ' · ' + room.no + ' 號房' +
      (room.isActive ? '' : '(已退房・' + room.checkedOutAt + ')');
    const avatarEl = document.getElementById('mainAvatar');
    if (room.avatarUrl){
      avatarEl.style.background = 'none';
      avatarEl.innerHTML = `<img src="${room.avatarUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:20px;">`;
    } else {
      avatarEl.style.background = 'radial-gradient(circle at 30% 30%,#E8DCC8,transparent 60%),linear-gradient(155deg,#D8CBAE,#B9A47D)';
      avatarEl.innerHTML = '';
    }

    const notesArea = document.getElementById('notesArea');
    if (room.notes){
      const text = [...room.notes.list, ...(room.notes.other ? ['其他:' + room.notes.other] : [])].join('、');
      notesArea.innerHTML = `<div class="notes-card warn">特殊注意事項:${text}</div>`;
    } else {
      notesArea.innerHTML = '';
    }

    const cameraArea = document.getElementById('cameraArea');
    if (room.isActive && globalMihomeUrl){
      cameraArea.innerHTML = `
        <div class="cam-card">
          <div>
            <p class="title">房內即時畫面</p>
            <p class="sub">透過小米智慧家庭 App 觀看</p>
          </div>
          <button class="cam-btn" id="camOpenBtn">開啟</button>
        </div>`;
      document.getElementById('camOpenBtn').addEventListener('click', openMihomeApp);
    } else {
      cameraArea.innerHTML = '';
    }

    const snackArea = document.getElementById('snackArea');
    if (viewMode === 'current'){
      snackArea.innerHTML = `
        <div class="snack-card">
          <span>想幫牠加點什麼嗎?</span>
          <a href="https://example.com/hakuke-shop-placeholder" target="_blank" rel="noopener">給寶貝加點小零食</a>
        </div>`;
    } else {
      snackArea.innerHTML = '';
    }

    if (!room.id || !room.stayId){
      document.getElementById('summaryStrip').innerHTML = '';
      document.getElementById('dayTabs').innerHTML = '';
      document.getElementById('timeline').innerHTML = '<div class="status-msg">這筆較舊的紀錄沒有留下每日細節,僅保留入住摘要。</div>';
      return;
    }

    document.getElementById('summaryStrip').innerHTML = '';
    document.getElementById('dayTabs').innerHTML = '';
    document.getElementById('timeline').innerHTML = '<div class="status-msg">讀取中...</div>';
    try {
      const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('讀取逾時,請檢查網路連線')), 15000));
      const entriesSnap = await Promise.race([getDocs(collection(db, 'rooms', room.id, 'entries')), timeoutPromise]);
      const entries = [];
      entriesSnap.forEach(d => { const data = d.data(); if (data.stayId === room.stayId) entries.push(data); });

      currentEntriesByDate = {};
      entries.forEach(e => {
        const ds = e.dateStr || dateStrOf(new Date(e.createdAtMs || Date.now()));
        if (!currentEntriesByDate[ds]) currentEntriesByDate[ds] = [];
        currentEntriesByDate[ds].push(e);
      });
      const today = dateStrOf(new Date());
      if (room.isActive && !currentEntriesByDate[today]) currentEntriesByDate[today] = [];
      const dates = Object.keys(currentEntriesByDate).sort().reverse();
      currentSelectedDate = room.isActive ? today : (dates[0] || today);
      if (!currentEntriesByDate[currentSelectedDate]) currentEntriesByDate[currentSelectedDate] = [];

      const dayTabs = document.getElementById('dayTabs');
      dayTabs.innerHTML = dates.map(ds =>
        `<div class="day-tab ${ds === currentSelectedDate ? 'active' : ''}" data-date="${ds}">${dateLabelOf(ds)}</div>`
      ).join('');
      dayTabs.querySelectorAll('.day-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          currentSelectedDate = tab.dataset.date;
          dayTabs.querySelectorAll('.day-tab').forEach(t => t.classList.toggle('active', t.dataset.date === currentSelectedDate));
          renderSelectedDay();
        });
      });

      renderSelectedDay();
    } catch (err) {
      document.getElementById('timeline').innerHTML = '<div class="status-msg" style="color:#E57373;">讀取失敗:' + err.message + '(請截圖回報)</div><div style="text-align:center;margin-top:8px;"><button id="retryRenderPetBtn" style="background:#B39DDB;border:none;border-radius:12px;padding:9px 20px;font-size:13.5px;cursor:pointer;">重試</button></div>';
      document.getElementById('retryRenderPetBtn').addEventListener('click', renderPet);
    }
  }

  const moodIconMap = { '活潑':'😄', '一般':'🙂', '較安靜':'😌', '休息或是睡眠較多':'😴', '反應異常':'⚠️' };

  function computeMoodIcon(allEntries){
    const bodychecks = allEntries.filter(e => e.panelId === 'bodycheck' && e.formSnapshot && e.formSnapshot.chips && e.formSnapshot.chips['bcSpiritState'] && e.formSnapshot.chips['bcSpiritState'].length)
      .sort((a,b) => (b.createdAtMs || 0) - (a.createdAtMs || 0));
    if (!bodychecks.length) return null;
    const spirit = bodychecks[0].formSnapshot.chips['bcSpiritState'][0];
    return { icon: moodIconMap[spirit] || '🙂', label: spirit };
  }

  function computeTodayHighlight(dayEntries){
    if (!dayEntries || !dayEntries.length) return '今日尚無紀錄';
    const warnEntries = dayEntries.slice().sort((a,b) => (a.createdAtMs || 0) - (b.createdAtMs || 0)).filter(e => e.warn);
    if (!warnEntries.length) return '📝 今日重點:狀況穩定,目前沒有異常紀錄';
    const bits = warnEntries.slice(-3).map(e => (e.contentParts && e.contentParts[0]) || e.content).filter(Boolean);
    return '📝 今日重點:' + bits.join('；');
  }

  function renderSelectedDay(){
    const dayEntries = (currentEntriesByDate[currentSelectedDate] || []).slice().sort((a,b) => (b.createdAtMs || 0) - (a.createdAtMs || 0));
    const room = visibleStays[currentIdx];
    const area = room ? room.area : 'cat';

    const allStayEntries = Object.values(currentEntriesByDate).flat();
    const mood = computeMoodIcon(allStayEntries);
    const moodRowEl = document.getElementById('moodRow');
    moodRowEl.innerHTML = mood ? '<span style="font-size:20px;">' + mood.icon + '</span><span>目前精神狀態:' + mood.label + '</span>' : '';
    document.getElementById('dayHighlight').textContent = computeTodayHighlight(dayEntries);

    const totalGrams = dayEntries.reduce((s,e) => s + (e.grams || 0), 0);
    const totalWater = dayEntries.reduce((s,e) => s + (e.waterMl || 0), 0);
    const totalPoop = dayEntries.reduce((s,e) => s + (e.poopGrams || 0), 0);

    let summaryHtml = `
      <div class="summary-item"><div class="num">${totalGrams}g</div><div class="lbl">今日進食量</div></div>
      <div class="summary-item"><div class="num">${totalWater}ml</div><div class="lbl">今日飲水量</div></div>
      <div class="summary-item"><div class="num">${totalPoop}g</div><div class="lbl">今日排便量</div></div>
    `;
    if (area === 'cat'){
      const totalPeeGrams = dayEntries.reduce((s,e) => s + (e.peeGrams || 0), 0);
      summaryHtml += `<div class="summary-item"><div class="num">${totalPeeGrams}g</div><div class="lbl">今日排尿量</div></div>`;
    } else {
      const totalPeeDiaper = dayEntries.reduce((s,e) => s + (e.peeDiaperGrams || 0), 0);
      const totalPeeCount = dayEntries.reduce((s,e) => s + (e.peeCount || 0), 0);
      summaryHtml += `<div class="summary-item"><div class="num">${totalPeeDiaper}g</div><div class="lbl">尿布墊排尿</div></div>`;
      summaryHtml += `<div class="summary-item"><div class="num">${totalPeeCount}次</div><div class="lbl">戶外排尿</div></div>`;
    }
    document.getElementById('summaryStrip').innerHTML = summaryHtml;

    const tl = document.getElementById('timeline');
    if (dayEntries.length === 0){
      tl.innerHTML = '<div class="status-msg">這天還沒有紀錄</div>';
      return;
    }
    tl.innerHTML = dayEntries.map(e => {
      const lines = (e.contentParts && e.contentParts.length) ? e.contentParts : [e.content];
      const photos = (e.photoUrls && e.photoUrls.length) ? e.photoUrls : (e.photoUrl ? [e.photoUrl] : []);
      return `
      <div class="entry ${e.warn ? 'warn' : ''}">
        <div class="time">${e.timeStr}</div>
        <div class="body">
          <p class="cat">${e.cat}</p>
          <p>${lines.join('，')}</p>
          ${photos.map(u => '<img src="'+u+'" style="width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-top:8px;">').join('')}
        </div>
      </div>`;
    }).join('');
  }
</script>
</body>
</html>
